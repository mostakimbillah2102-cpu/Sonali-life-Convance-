<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#047857" />
    <meta name="description" content="Advanced branch search and bill generation dashboard" />
    <title>সোনালী লাইফ - স্মার্ট সিস্টেম</title>
    
    <!-- Tailwind CSS (Using CDN for simplicity, but ideally should be installed via npm for production) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"SutonnyMJ"', '"SutonnyOMJ"', '"Nikosh"', '"SolaimanLipi"', '"Kalpurush"', '"Hind Siliguri"', 'sans-serif'],
              serif: ['"SutonnyMJ"', '"SutonnyOMJ"', '"Nikosh"', '"SolaimanLipi"', '"Tiro Bangla"', 'serif'],
              sutonny: ['"SutonnyMJ"', '"SutonnyOMJ"', '"Nikosh"', '"SolaimanLipi"', 'sans-serif'],
            },
            colors: {
              emerald: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              }
            }
          },
        },
      }
    </script>
    <style>
      @font-face {
        font-family: 'SutonnyMJ';
        src: local('SutonnyMJ'),
             local('SutonnyOMJ'),
             local('Sutonny OMJ'),
             local('Sutonnymj'),
             url('/fonts/SutonnyOMJ.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0980-09FF, U+200C-200D, U+25CC;
      }

      @font-face {
        font-family: 'SutonnyMJ';
        src: local('SutonnyMJ Bold'),
             local('Sutonny OMJ Bold'),
             local('SutonnyOMJ Bold'),
             url('/fonts/Sutonny-Bold.ttf') format('truetype'),
             url('/fonts/SutonnyOMJ.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0980-09FF, U+200C-200D, U+25CC;
      }

      @font-face {
        font-family: 'SutonnyOMJ';
        src: local('Sutonny OMJ'),
             local('SutonnyOMJ'),
             local('SutonnyMJ'),
             url('/fonts/SutonnyOMJ.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0980-09FF, U+200C-200D, U+25CC;
      }

      @font-face {
        font-family: 'SutonnyOMJ';
        src: local('Sutonny OMJ Bold'),
             local('SutonnyOMJ Bold'),
             local('SutonnyMJ Bold'),
             url('/fonts/Sutonny-Bold.ttf') format('truetype'),
             url('/fonts/SutonnyOMJ.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0980-09FF, U+200C-200D, U+25CC;
      }

      html, body, #root {
        font-family: 'SutonnyMJ', 'SutonnyOMJ', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }

      /* Native monospace for English digits, code, emails, and keyboard shortcuts */
      .font-mono, kbd, code, .en-text, [lang="en"] {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
      }

      body {
        font-family: 'SutonnyMJ', 'SutonnyOMJ', 'Nikosh', 'SolaimanLipi', 'Kalpurush', 'Hind Siliguri', sans-serif;
        background-color: #f0fdf4;
        overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile app feel */
      }
      .dark body {
        background-color: #111827; /* gray-900 */
        color: #f3f4f6; /* gray-100 */
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
